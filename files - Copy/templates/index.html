<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>دانلود ویدیو و آهنگ اینستاگرام</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <div class="bg-glow"></div>

  <main class="container">
    <header class="header">
      <div class="logo">🎬</div>
      <h1>دانلود از اینستاگرام</h1>
      <p class="subtitle">لینک پست یا ریل اینستاگرام رو وارد کن</p>
    </header>

    <div class="card">
      <div class="input-row">
        <input
          type="text"
          id="url-input"
          placeholder="https://www.instagram.com/reel/..."
          autocomplete="off"
        />
      </div>

      <div class="btn-row">
        <button id="video-btn" class="primary-btn">
          <span class="btn-text">🎥 دانلود ویدیو</span>
          <span class="spinner hidden"></span>
        </button>
        <button id="audio-btn" class="secondary-btn">
          <span class="btn-text">🎵 دانلود آهنگ</span>
          <span class="spinner hidden"></span>
        </button>
      </div>

      <div id="result-box" class="result-box hidden"></div>
      <div id="error-box" class="error-box hidden"></div>
    </div>

    <footer class="footer">
      <p>⚠️ فقط برای محتوای عمومی و شخصی استفاده کن و به قوانین کپی‌رایت اینستاگرام احترام بذار.</p>
    </footer>
  </main>

  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
